[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-testing-agent"
version = "1.0.0"
description = "AI-assisted API testing pipeline: OpenAPI -> RAG + DeepSeek -> test cases -> deterministic PyTest -> reports -> controlled repair loop"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# 依赖版本统一由 requirements.txt 固化（保证本地/CI 一致）
dependencies = []

[tool.setuptools]
packages = ["ai_testing_agent", "ai_testing_agent.demos"]

[tool.pytest.ini_options]
# 仅自动收集回归测试；generated_tests/ 需要活服务，只被显式指定时运行
testpaths = ["tests"]
