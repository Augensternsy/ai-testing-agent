name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # CI 不依赖真实 OPENAI_API_KEY：
      # Stage 1 / 3 / 4 为纯确定性测试；Stage 2 / 5 中 LLM 相关路径全部走 Mock。
      # Real DeepSeek E2E（demos/demo_real_llm_pipeline.py）不在 CI 中执行。
      - name: Run regression tests
        env:
          OPENAI_API_KEY: ""
        shell: bash
        run: |
          set -o pipefail
          pytest \
            tests/test_api_schema_parser.py \
            tests/test_api_test_case_generator.py \
            tests/test_test_code_generator.py \
            tests/test_test_runner.py \
            tests/test_failure_analyzer.py \
            tests/test_safe_test_repair.py \
            tests/test_agent_orchestrator.py \
            --basetemp=.pytest_tmp -v 2>&1 | tee .pytest_output.txt

      # 将 pytest 汇总行写为 check-run notice 注解（公开仓库可经 REST API 匿名读取），
      # 使 CI 的 Total/Passed/Failed/Skipped 可被机器核验，无需登录网页日志。
      - name: Report pytest summary
        if: always()
        shell: bash
        run: |
          line=$(grep -E '=+ *[0-9]+ (passed|failed|skipped|error|xfailed|xpassed)' .pytest_output.txt | tail -1 | sed 's/^=* *//; s/ *=*$//')
          echo "Pytest summary: $line"
          echo "::notice title=Pytest Summary::${line}"
          {
            echo "### Pytest summary"
            echo '```'
            echo "$line"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
